name = "lunch-uncle"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Serve the chat page from a plain HTML file, imported as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Secrets and settings (OPENCODE_API_KEY, GOOGLE_PLACES_API_KEY,
# LLM_BASE_URL, LLM_MODEL) are set with
# `wrangler secret put` for deploys and `.env` for local development.
# Never put them in this file.

# Per-IP rate limit for POST /chat, so a public URL cannot burn the API keys.
# namespace_id is any integer, but it must be unique to this Worker within the
# Cloudflare account, or two Workers will share one counter.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "4201"
simple = { limit = 10, period = 60 }
